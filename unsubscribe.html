<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/Public/Images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="/Public/blog/blog.css">
<meta name="robots" content="noindex">
<title>Unsubscribe | Heddi Strategies</title>
</head>
<body>
<a class="skip" href="#main-content">Skip to main content</a>
<div class="grain" aria-hidden="true"></div>
<nav class="site-nav" aria-label="Main">
  <div class="wrap bar">
    <a class="logo" href="/index.html"><img src="/Public/Images/Heddi%20Strategies%20Logo%20Type%20White.png" alt="Heddi Strategies"></a>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/about.html">About</a>
      <a href="/faq.html">FAQ</a>
      <a href="/insights">Insights</a>
    </div>
    <a class="btn" href="/contact.html">Contact Us</a>
    <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
    <a href="/faq.html">FAQ</a>
    <a href="/insights">Insights</a>
    <a class="btn" href="/contact.html">Contact Us</a>
  </div>
</nav>
<main id="main-content">
<section class="wrap" style="padding-top:140px;padding-bottom:160px;max-width:720px">
  <p class="eyebrow">The Heddi Brief</p>
  <h1 class="serif" id="u-title" style="margin:24px 0 16px;font-size:clamp(36px,5vw,56px);line-height:1.1">Unsubscribe from <em>The Heddi Brief</em>?</h1>
  <p id="u-msg" style="font-size:18px;color:var(--muted);margin:0 0 32px">You will stop getting new-article emails from Heddi Strategies.</p>
  <button class="btn" type="button" id="u-btn">Unsubscribe</button>
  <p style="margin-top:32px"><a class="back" href="/insights">Back to insights</a></p>
</section>
</main>
<script type="module">
  import { sb, initMobileMenu } from '/Public/blog/lib.js';
  initMobileMenu();
  const token = new URLSearchParams(location.search).get('token');
  const btn = document.getElementById('u-btn'), t = document.getElementById('u-title'), m = document.getElementById('u-msg');
  if (!token) { btn.hidden = true; t.textContent = 'Link not recognized'; m.textContent = 'Use the unsubscribe link at the bottom of any Heddi Brief email.'; }
  btn.onclick = async () => {
    btn.disabled = true;
    const { data, error } = await sb.rpc('unsubscribe', { p_token: token });
    btn.hidden = true;
    if (error || !data) { t.textContent = 'Link not recognized'; m.textContent = 'We could not find that subscription. You may already be removed.'; return; }
    t.innerHTML = 'You are <em>unsubscribed</em>.';
    m.textContent = 'You will not get any more emails from The Heddi Brief. Changed your mind? Sign up again on the blog anytime.';
  };
</script>
</body>
</html>
